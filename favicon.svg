<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.4" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle / Shield -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#shieldBorder)" stroke-width="3" />

  <!-- Inner Decorative Ring -->
  <rect x="12" y="12" width="104" height="104" rx="24" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Academic Emblem: Graduation Cap + Open Book + Stars -->
  <g filter="url(#subtleShadow)">
    <!-- Graduation Cap Mortarboard Top -->
    <polygon points="64,28 102,44 64,60 26,44" fill="url(#goldGrad)" />
    
    <!-- Cap Skull Cap Underneath -->
    <path d="M42,51 L42,66 C42,75 86,75 86,66 L86,51 C79,56 71,59 64,59 C57,59 49,56 42,51 Z" fill="#b45309" />
    
    <!-- Tassel Ribbon & Drop -->
    <path d="M64,44 Q90,48 94,62" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="94" cy="65" r="3.5" fill="#fef08a" />

    <!-- Open Knowledge Book -->
    <g transform="translate(0, 4)">
      <!-- Left Page -->
      <path d="M64,74 C54,69 38,69 28,73 L28,95 C38,91 54,91 64,96 Z" fill="#ffffff" fill-opacity="0.95" />
      <!-- Right Page -->
      <path d="M64,74 C74,69 90,69 100,73 L100,95 C90,91 74,91 64,96 Z" fill="#f8fafc" fill-opacity="0.95" />
      <!-- Book Spine Center -->
      <path d="M64,74 L64,96" stroke="#064e3b" stroke-width="2" stroke-linecap="round" />
      
      <!-- Academic Pages Text Lines (Simulated gold strokes) -->
      <line x1="36" y1="78" x2="56" y2="78" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
      <line x1="36" y1="83" x2="54" y2="83" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
      <line x1="36" y1="88" x2="50" y2="88" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />

      <line x1="72" y1="78" x2="92" y2="78" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
      <line x1="74" y1="83" x2="92" y2="83" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
      <line x1="78" y1="88" x2="92" y2="88" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- University Laurel / Palm Leaves Base -->
    <g fill="url(#goldGrad)" transform="translate(0, 4)">
      <!-- Central Star -->
      <polygon points="64,103 66,108 71,108 67,111 68,116 64,113 60,116 61,111 57,108 62,108" />
    </g>
  </g>
</svg>
